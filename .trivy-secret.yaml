# Secret-scanner rules for the credentials THIS repository actually handles.
#
# Trivy's built-in rules catch the usual suspects (GitHub PATs, cloud keys). They do not know about
# Sentry, and a Sentry ORG auth token is the one real credential in this project: it is org-wide, it
# uploads debug symbols and source maps, and it lives in `sentry.properties`, which is gitignored
# precisely because it must never be committed. Verified against a planted token: the built-in rules
# scanned it and said nothing.
#
# The DSN is deliberately NOT here. It ships inside every copy of the app and grants one capability,
# sending events to one project; Sentry's own guidance is that it may be public. A rule matching it
# would fail this build on `src/services/telemetry/dsn.ts`, which is committed on purpose, and a
# scanner that cries wolf on an intentional file is a scanner everyone learns to skip.

rules:
  - id: sentry-org-auth-token
    category: Sentry
    title: Sentry organization auth token
    severity: CRITICAL
    # `sntrys_` + base64url payload + `_` + signature. Deliberately loose on length: the point is to
    # notice the prefix at all, not to validate the token.
    regex: \bsntrys_[A-Za-z0-9+/=_-]{20,}

  - id: sentry-legacy-auth-token
    category: Sentry
    title: Sentry auth token (legacy 64-hex form)
    severity: CRITICAL
    # The older personal/internal tokens, which are 64 hex characters and therefore need an anchor to
    # avoid matching every hash in a lockfile. `auth.token=` / `SENTRY_AUTH_TOKEN=` is that anchor.
    regex: (?i)(sentry[_-]?auth[_-]?token|auth\.token)\s*[=:]\s*['"]?[0-9a-f]{64}

  - id: obalka-recovery-key
    category: Obálka
    title: Backup recovery key
    severity: CRITICAL
    # The key that opens a user's encrypted backup, in the grouped form the app renders and the QR
    # encodes. Already denied by the debug-log redactor (`services/debug/debugRedact.ts`); this is the
    # same value, guarded on the way into the repository rather than on the way into a log.
    regex: \b(?:OBALKA:)?[0-9A-HJKMNP-TV-Z]{4}(?:-[0-9A-HJKMNP-TV-Z]{4}){4}\b
